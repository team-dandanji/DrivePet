# 클라우드 VM 배포용 덮어쓰기. DB·서버 포트는 바깥에 열지 않고 Caddy(80·443)만 연다.
# docker compose -f compose.yaml -f compose.deploy.yaml up -d --build
# .env에 DB_PASSWORD, DRIVEPET_HOST(예: 1-2-3-4.sslip.io)가 있어야 한다.
services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
    restart: unless-stopped

  server:
    ports: !reset []
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - server
    environment:
      DRIVEPET_HOST: ${DRIVEPET_HOST:?DRIVEPET_HOST 필요}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
