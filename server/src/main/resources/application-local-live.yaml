# 실제 외부 API 사용. 키가 없으면 시작하지 않는다(가짜로 자동 전환하지 않음).
drivepet:
  kakao:
    mode: live
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 탈퇴 때 카카오 쪽 연결 끊기용. 비우면 DB만 파기한다
    admin-key: ${KAKAO_ADMIN_KEY:}
  weather:
    mode: live
    service-key: ${DATA_GO_KR_SERVICE_KEY}
